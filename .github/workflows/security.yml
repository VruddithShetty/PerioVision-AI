# Security scanning. Split from ci.yml so a vulnerability report is easy to find
# and so the scans can run on a schedule, not only when someone pushes.
#
# Five jobs, each covering something the others do not:
#   pip-audit / npm audit  known CVEs in our declared dependencies
#   gitleaks               credentials in the tree or anywhere in its history
#   CodeQL                 static analysis of our own Python and TypeScript
#   Trivy                  CVEs in the container we actually ship, base image included
#   SBOM                   what is in that image, recorded per build
# Deliberately omitted: Bandit and Semgrep, whose Python coverage overlaps CodeQL's.
#
# Every action is pinned to a commit SHA, not a tag. A tag is a mutable pointer: whoever
# controls the action repository can move v4 to new code, and that code runs here with
# this repository's token. The comment after each pin records the human-readable version.
name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly, so newly disclosed CVEs in unchanged dependencies still surface.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency CVEs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          python -m pip install --upgrade pip pip-audit
          # Audits the pinned list without installing torch and friends.
          pip-audit --requirement backend/requirements.txt --strict --progress-spinner off

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Two steps on purpose. The gate is what actually ships to a browser; the
      # second reports the build-time tree without blocking on advisories that have
      # no upstream fix. Checked at the time of writing: braces has only ever
      # published up to 3.0.3 and the advisory covers <=3.0.3, so there is nothing to
      # upgrade to, and micromatch and fast-glob are flagged solely via braces. The
      # remainder need Tailwind 3 -> 4 and Vite 5 -> 8, both breaking framework
      # migrations, for a denial-of-service in tooling that never reaches production.
      - name: npm audit (production dependencies - gate)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (build-time dependencies - reported, not gated)
        working-directory: frontend
        if: always()
        run: npm audit --audit-level=high || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a key that was committed and later deleted is still
          # exposed, and a shallow clone would miss it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"

  container:
    name: Container image scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pip-audit covers what we declare; this covers what we ship. The base image
      # carries an OS userland - openssl, zlib, libxml2 - that no Python manifest lists.
      # id + explicit conditions below: without them the Trivy steps run on a failed
      # build, find no local image, and fall back to pulling periovision-backend from
      # Docker Hub - which fails with a message that looks like a scan problem rather
      # than the build problem it actually is.
      - name: Build the image
        id: build
        run: docker build -t periovision-backend:scan backend

      - name: Trivy scan (fail on HIGH and CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: periovision-backend:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          # An unfixed CVE cannot be acted on by upgrading, so it would only teach
          # people to ignore a red build. It still appears in the SARIF upload below.
          ignore-unfixed: true

      - name: Trivy scan (full report for the Security tab)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: periovision-backend:scan
          format: sarif
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL

      - name: Publish to the Security tab
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  sbom:
    name: SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A bill of materials per build: what shipped, so a future advisory can be
      # answered with "were we affected?" instead of a guess.
      - name: Backend SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          python -m cyclonedx_py requirements backend/requirements.txt \
            --output-format JSON --output-file sbom-backend.cdx.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend SBOM (CycloneDX)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --output-format JSON \
            --output-file ../sbom-frontend.cdx.json

      - name: Keep the SBOMs with the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90

  model-integrity:
    name: Model manifest integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Weight files are gitignored, so there is nothing to verify signatures against
      # here. What this does check is that the approval metadata the registry reads is
      # present and well formed, which is what a bad merge would break.
      - name: Approval metadata is valid and complete
        run: |
          python - <<'EOF'
          import json, sys

          REQUIRED = ("file", "model_version", "approval_status")
          with open("backend/config/model_approvals.json", encoding="utf-8") as f:
              models = json.load(f).get("models") or {}

          if not models:
              sys.exit("model_approvals.json declares no models")

          problems = []
          for name, meta in models.items():
              missing = [k for k in REQUIRED if not meta.get(k)]
              if missing:
                  problems.append(f"{name}: missing {', '.join(missing)}")
              status = str(meta.get("approval_status", "")).lower()
              if status not in ("approved", "pending", "revoked"):
                  problems.append(f"{name}: unknown approval_status {status!r}")
              if status == "approved" and not meta.get("approved_by"):
                  problems.append(f"{name}: approved but nobody is recorded as approving it")

          if problems:
              sys.exit("model approval metadata is invalid:\n  " + "\n  ".join(problems))
          print(f"{len(models)} model(s) declared, metadata well formed")
          for name, meta in models.items():
              print(f"  {name}: v{meta['model_version']} [{meta['approval_status']}]")
          EOF
