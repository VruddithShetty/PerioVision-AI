# PerioVision AI - local stack (backend + MongoDB). The React frontend is added in Phase 4.
# All secrets come from the root .env file (copy .env.example to .env first). Nothing secret lives here.
services:
  mongodb:
    image: mongo:7.0
    container_name: periovision_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: periovision_db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: periovision_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_MODE: production
      HOST: 0.0.0.0
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/periovision_db?authSource=admin
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/logs:/app/logs
      - ./backend/weights:/app/weights:ro
      - ./backend/keys:/app/keys

volumes:
  mongodb_data:
